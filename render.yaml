# ============================================================
# We-MP-RSS 部署 —— Render Blueprint（PostgreSQL 版：免费 + 持久，推荐）
# 用法：把本仓库推到 GitHub 后，Render 控制台 → New → Blueprint → 连接仓库 → Apply。
# 文档：https://render.com/docs/blueprint-spec
#
# ✅ 本配置即生产环境：Render 原生 Postgres，【免费且持久】，DB 连接串由 Render 自动注入，
#    无需自备数据库、无需付费。Web 服务默认 Free 套餐（如需 7×24 不休眠可改为 starter）。
#    (原仓库 config.example.yaml 第 27 行已声明支持 postgresql://)
#
# ⚠️ 若你坚持用 MySQL（Render 无托管 MySQL，需付费约 $14/月），见本仓库 DEPLOY-GITHUB.md
#    「生产部署 · MySQL 替代方案」代码块，照抄为 render.yaml 即可。
# ============================================================

services:
  # ---------- 1) PostgreSQL 数据库（Render 原生，免费 + 持久）----------
  - type: postgres
    name: we-mp-rss-db
    plan: free
    region: oregon
    databaseName: we_mp_rss
    user: rss_user
    # 会自动注入环境变量 DATABASE_URL，供下方 web 服务引用

  # ---------- 2) We-MP-RSS Web 服务（公网可访问）----------
  - type: web
    name: we-mp-rss
    image:
      image: ghcr.io/rachelos/we-mp-rss:latest
    plan: free                     # 生产如需不休眠可改 starter
    region: oregon
    healthCheckPath: /
    ports:
      - 8001
    envVars:
      - key: DB
        sync: false
        value: "{{WE_MP_RSS_DB_DATABASE_URL}}"   # 自动注入 Postgres 连接串
      - key: USERNAME
        value: admin
      - key: PASSWORD
        value: admin@123
      - key: ENABLE_JOB
        value: "True"
      - key: WEB_NAME
        value: WeRSS微信公众号订阅助手
      # 生产务必设置随机强密钥（取消注释后 Render 会自动生成）
      # - key: SECRET_KEY
      #   generateValue: true
      # Redis：应用内置 Redis 服务端，可不单独部署；如需外置再填 REDIS_URL
      # - key: REDIS_URL
      #   value: redis://redis.onrender.com:6379/0
      # 代理（采集公众号常需）：如在中国大陆采集，Render 美区可能被微信限流，
      # 可取消下方 singbox 服务与相关注释（需自备代理配置）
      # - key: PROXY_HTTP_URL
      #   value: http://singbox.onrender.com:7890

  # ---------- （可选）singbox 代理服务：仅当你需要代理才能采集公众号时启用 ----------
  # - type: pserv
  #   name: singbox
  #   image: ghcr.io/sagernet/sing-box:latest
  #   plan: starter
  #   region: oregon
  #   envVars:
  #     - key: SINGBOX_INBOUND_PORT
  #       value: "7890"
  #     - key: SINGBOX_LOG_LEVEL
  #       value: info
